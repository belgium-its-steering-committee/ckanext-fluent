{% set translations = data[field.field_name] %}
<ul>
    {% for lang in ['en', 'nl', 'fr', 'de'] %}
        {% set translation = translations.get(lang) %}
        <li>
            {{ lang|upper }}:
            {% if translation %}
                <p id="{{ lang }}-preview" style="margin: 0; padding: 0;"
                   data-preview-text="{{ h.render_markdown(translation)[:100]|escape }}{% if translation|length > 100 %}...{% endif %}">
                </p>
                {% if translation|length > 100 %}
                    <a href="#" id="{{ lang }}-read-more" data-full-text="{{ h.render_markdown(translation)|escape }}">
                        <span id="expand-icon">▼</span>
                    </a>
                {% endif %}
            {% else %}
                <p id="{{ lang }}-preview" style="margin: 0; padding: 0;"> </p>  <!-- Empty preview if no translation -->
            {% endif %}
        </li>
    {% endfor %}
</ul>

<script>
  $(document).ready(function() {
    // Iterate through each preview element
    $('[data-preview-text]').each(function() {
      // Get the language from the ID (e.g., 'en', 'fr', etc.)
      var lang = $(this).attr('id').split('-')[0];

      // Get the preview content and the full text
      var previewContent = $(this).data('preview-text');
      var fullText = $('#' + lang + '-read-more').data('full-text');

      // Apply slicing to preview content
      var newPreviewText = previewContent.length > 100 ? previewContent.slice(3) : previewContent.slice(3, -4);

      // Set the preview text
      $(this).text(newPreviewText);

      // Add event listener for the "read more" link
      $('#' + lang + '-read-more').on('click', function(e) {
        e.preventDefault(); // Prevent default action

        var expandIcon = $(this).find('span#expand-icon');

        // Apply slicing to full text
        var newFullText = fullText.slice(3, -4);

        // Toggle between showing and hiding the full text
        if ($('#' + lang + '-full').length === 0) {
          $('<p>', {
            id: lang + '-full',
            text: newFullText,
            css: { margin: 0, padding: 0 }
          }).insertAfter('#' + lang + '-preview');

          $('#' + lang + '-preview').hide(); // Hide the preview
          expandIcon.text('▲'); // Change the icon to up
        } else {
          $('#' + lang + '-full').remove(); // Remove the full text
          $('#' + lang + '-preview').show(); // Show the preview
          expandIcon.text('▼'); // Change the icon to down
        }
      });
    });
  });
</script>
